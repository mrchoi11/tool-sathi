name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Build application
        run: npm run build
        env:
          VITE_GATEWAY_URL: https://toolsathi-gateway.policyian.workers.dev

      - name: 5. Verify dist output
        run: |
          ls -la dist
          test -f dist/index.html || (echo "Error: index.html missing!" && exit 1)
          test -f dist/.htaccess || (echo "Error: .htaccess missing!" && exit 1)

      - name: 6. Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ./dist/
          server-dir: ./tool-sathi/
