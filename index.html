<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>ToolSathi — Free Online Tools for Video, PDF, Image & More</title>
    <meta name="title" content="ToolSathi — Free Online Tools for Video, PDF, Image & More" />

    <meta name="keywords" content="toolsathi, online tools, video player, terabox player, PDF merger, image compressor, QR code generator, file converter, free tools, browser tools" />
    <meta name="author" content="ToolSathi" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://protoolbox.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://protoolbox.in/" />

    <meta property="og:description" content="75+ free browser-based online tools: play videos, merge PDFs, compress images, generate QR codes, convert formats, and more." />
    <meta property="og:image" content="https://protoolbox.in/og-image.png" />
    <meta property="og:site_name" content="ToolSathi" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />

    <meta property="twitter:description" content="75+ free browser-based online tools. Fast, private, no file uploads needed." />
    <meta property="twitter:image" content="https://protoolbox.in/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts: Plus Jakarta Sans + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ToolSathi" />

    <!-- JSON-LD Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ToolSathi",
      "url": "https://protoolbox.in",
      "description": "75+ free browser-based online tools for Video, PDF, Image, conversion, and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://protoolbox.in/tools?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",

    <!-- Browser Image Compression CDN -->
