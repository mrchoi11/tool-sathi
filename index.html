<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>ToolSathi — Free Online Tools for PDF, Image, Video & More</title>
    <meta name="title" content="ToolSathi — Free Online Tools for PDF, Image, Video & More" />
    <meta name="description" content="65+ free browser-based tools: merge PDFs, compress images, play videos, generate QR codes, convert formats and more. Fast, private, no uploads needed." />
    <meta name="keywords" content="online tools, PDF merger, image compressor, video player, QR code generator, file converter, free tools, browser tools, ToolSathi" />
    <meta name="author" content="ToolSathi" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://toolsathi.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://toolsathi.com/" />
    <meta property="og:title" content="ToolSathi — Free Online Tools for PDF, Image, Video & More" />
    <meta property="og:description" content="65+ free browser-based tools: merge PDFs, compress images, play videos, generate QR codes, convert formats and more." />
    <meta property="og:image" content="https://toolsathi.com/og-image.png" />
    <meta property="og:site_name" content="ToolSathi" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://toolsathi.com/" />
    <meta property="twitter:title" content="ToolSathi — Free Online Tools for PDF, Image, Video & More" />
    <meta property="twitter:description" content="65+ free browser-based tools. Fast, private, no uploads needed." />
    <meta property="twitter:image" content="https://toolsathi.com/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts: Inter + Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ToolSathi" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ToolSathi",
      "url": "https://toolsathi.com",
      "description": "65+ free browser-based tools for PDF, Image, Video conversion and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://toolsathi.com/tools?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ToolSathi",
      "url": "https://toolsathi.com",
      "logo": "https://toolsathi.com/favicon.svg",
      "sameAs": []
    }
    <!-- Browser Image Compression CDN -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
