<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Size Reducer — Client-Side Fast Compression</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- browser-image-compression CDN as specified in architecture -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl shadow-2xl p-6 sm:p-8">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-3 border border-indigo-500/20">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Image Size Reducer</h1>
      <p class="text-sm text-slate-400 mt-1">Compress large images client-side in your browser without timeouts or uploads.</p>
    </div>

    <!-- Dropzone -->
    <div
      id="dropzone"
      onclick="document.getElementById('imageInput').click()"
      class="border-2 border-dashed border-slate-600 hover:border-indigo-500 bg-slate-900/50 hover:bg-slate-900/80 rounded-xl p-8 text-center cursor-pointer transition-all duration-200"
    >
      <input
        type="file"
        id="imageInput"
        accept="image/*"
        class="hidden"
        onchange="onFileSelected(this.files)"
      />
      <div class="flex flex-col items-center justify-center">
        <svg class="w-10 h-10 text-indigo-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
        </svg>
        <span class="text-sm font-semibold text-slate-200">Click to upload or drag & drop</span>
        <span class="text-xs text-slate-500 mt-1">Supports PNG, JPG, JPEG, WebP</span>
      </div>
    </div>

    <!-- Selected File Information -->
    <div id="fileInfoBox" class="hidden mt-4 p-4 bg-slate-900/60 rounded-xl border border-slate-700/50 flex items-center justify-between">
      <div class="truncate mr-4">
        <span id="fileName" class="text-sm font-medium text-slate-200 block truncate"></span>
        <span id="fileSize" class="text-xs text-slate-400"></span>
      </div>
      <button
        type="button"
        onclick="reduceImageSize()"
        class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-lg shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
        Compress Now
      </button>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="hidden mt-6 text-center py-4 bg-indigo-950/30 border border-indigo-500/20 rounded-xl">
      <div class="inline-block w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-2"></div>
      <p class="text-sm font-medium text-indigo-300">Compressing image with WebWorker...</p>
    </div>

    <!-- Error Alert -->
    <div id="errorAlert" class="hidden mt-4 p-3.5 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm rounded-xl"></div>

    <!-- Results Box -->
    <div id="resultBox" class="hidden mt-6 p-5 bg-emerald-950/20 border border-emerald-500/30 rounded-xl">
      <div class="flex items-center justify-between mb-4">
        <span class="text-sm font-semibold text-emerald-400 flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          Compression Complete!
        </span>
        <span id="savingsTag" class="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-mono"></span>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4 text-center">
        <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/40">
          <span class="text-xs text-slate-400 block">Original</span>
          <span id="originalStat" class="text-sm font-semibold text-slate-200"></span>
        </div>
        <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/40">
          <span class="text-xs text-slate-400 block">Compressed</span>
          <span id="compressedStat" class="text-sm font-semibold text-emerald-400"></span>
        </div>
      </div>

      <a
        id="downloadBtn"
        href="#"
        class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-lg shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 transition-all"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        Download Compressed Image
      </a>
    </div>
  </div>

  <script>
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showLoading(show) {
      document.getElementById('loadingIndicator').classList.toggle('hidden', !show);
      document.getElementById('errorAlert').classList.add('hidden');
    }

    function setDownloadLink(url, filename) {
      const btn = document.getElementById('downloadBtn');
      btn.href = url;
      btn.download = filename;
      document.getElementById('resultBox').classList.remove('hidden');
    }

    function onFileSelected(files) {
      if (!files.length) return;
      const file = files[0];
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileSize').textContent = 'Size: ' + formatBytes(file.size);
      document.getElementById('fileInfoBox').classList.remove('hidden');
      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('errorAlert').classList.add('hidden');
    }

    // Drag and drop handlers
    const dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('border-indigo-500', 'bg-slate-900/80'); });
    dropzone.addEventListener('dragleave', (e) => { e.preventDefault(); dropzone.classList.remove('border-indigo-500', 'bg-slate-900/80'); });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('border-indigo-500', 'bg-slate-900/80');
      if (e.dataTransfer.files.length) {
        document.getElementById('imageInput').files = e.dataTransfer.files;
        onFileSelected(e.dataTransfer.files);
      }
    });

    // Exact compression logic as specified in prompt
    async function reduceImageSize() {
      const fileInput = document.getElementById('imageInput');
      if (!fileInput.files.length) return alert('Please select an image!');
      const imageFile = fileInput.files[0];
      const options = { maxSizeMB: 1, maxWidthOrHeight: 1920, useWebWorker: true };
      try {
        showLoading(true);
        const compressedFile = await imageCompression(imageFile, options);
        showLoading(false);
        const downloadUrl = URL.createObjectURL(compressedFile);
        setDownloadLink(downloadUrl, 'compressed-' + imageFile.name);

        // Populate stats
        document.getElementById('originalStat').textContent = formatBytes(imageFile.size);
        document.getElementById('compressedStat').textContent = formatBytes(compressedFile.size);
        const savings = Math.max(0, Math.round(((imageFile.size - compressedFile.size) / imageFile.size) * 100));
        document.getElementById('savingsTag').textContent = '-' + savings + '%';
      } catch (error) {
        showLoading(false);
        const alertEl = document.getElementById('errorAlert');
        alertEl.textContent = 'Compression failed: ' + error.message;
        alertEl.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
